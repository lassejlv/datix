[workspace]
members = ["crates/api", "crates/auth", "crates/db"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
url = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
subtle = "2"
rand = "0.8"
scrypt = "0.11"
unicode-normalization = "0.1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
email-sdk = "=0.1.1"
standardwebhooks = "=1.0.1"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex = "1"
icu_collator = "=2.3.1"
icu_locale_core = "2"
indexmap = "2"
flate2 = "1"
crc32fast = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
redis = { version = "0.32", features = ["tokio-rustls-comp", "connection-manager"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls-no-provider", "tower", "tracing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true
